[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-collaboration-platform"
version = "0.1.0"
description = "面向需求变更的可验证 FPGA 软硬件协同开发工作台"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4", "alembic>=1.14,<2", "argon2-cffi>=23",
  "cryptography>=44", "jsonschema>=4.23", "referencing>=0.35", "rfc8785>=0.1",
  "httpx>=0.28,<1", "python-multipart>=0.0.20", "pypdf>=5", "python-docx>=1.1",
  "openpyxl>=3.1", "pillow>=11", "pgvector>=0.3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.9"]

[project.scripts]
fpga-platform = "apps.api.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "packages*", "products*", "workers*", "acceptance_service*"]

[tool.setuptools.package-data]
"packages.contracts" = ["schemas/*.json", "api/*.json", "protocol/*.json", "examples/*.json", "acceptance/*.json", "planning/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
