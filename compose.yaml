services:
  database:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fpga_platform
      POSTGRES_USER: fpga
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/setup.ps1 first}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fpga -d fpga_platform']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
